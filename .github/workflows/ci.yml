name: CHIEF verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chief-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/chief-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
