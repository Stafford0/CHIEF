[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chief-ai"
version = "0.0.1"
description = "CHIEF — Cognitive Hub for Intelligence, Execution & Foresight"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
