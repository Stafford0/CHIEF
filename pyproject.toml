[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chief-ai"
version = "0.0.1"
description = "CHIEF — Cognitive Hub for Intelligence, Execution & Foresight"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx2",
]
windows = [
  "pywin32>=311; platform_system == 'Windows'",
]

[project.scripts]
chief-runtime = "chief.runtime.worker:main"
chief-windows-service = "chief.runtime.windows_service:main"
chief-recovery = "chief.ops.recovery_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
